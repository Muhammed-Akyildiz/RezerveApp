name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$VPS_SSH_KEY_B64" | base64 -d > /tmp/private_key
          chmod 600 /tmp/private_key

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key_path: /tmp/private_key
          port: 22
          script: |
            cd /var/www/rezerveapp
            git stash
            git pull origin main
            cd RezerveApp
            dotnet publish -c Release -o /var/www/rezerveapp/publish
            chown -R www-data:www-data /var/www/rezerveapp/publish
            systemctl restart rezerveapp.service