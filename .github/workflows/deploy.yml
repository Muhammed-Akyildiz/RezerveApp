name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug SSH Key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/test_key
          chmod 600 /tmp/test_key

          echo "Key length: ${#VPS_SSH_KEY}"
          echo "Testing private key format..."

          ssh-keygen -y -f /tmp/test_key > /tmp/test_public_key

          echo "Private key is VALID."
          echo "Generated public key:"
          ssh-keygen -lf /tmp/test_public_key

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/rezerveapp
            git stash
            git pull origin main
            cd RezerveApp
            dotnet publish -c Release -o /var/www/rezerveapp/publish
            chown -R www-data:www-data /var/www/rezerveapp/publish
            systemctl restart rezerveapp.service